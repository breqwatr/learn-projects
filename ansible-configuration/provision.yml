- name: Provision instances on Breqwatr Cloud
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Add the SSH public key
      openstack.cloud.keypair:
        cloud: "{{ cloud }}"
        name: "{{ prefix }}-key"
        public_key: "{{ lookup('file', public_key_file) }}"

    - name: Create the security group
      openstack.cloud.security_group:
        cloud: "{{ cloud }}"
        name: "{{ prefix }}-access"

    - name: Allow SSH, WinRM over HTTPS and HTTP from your IP address
      openstack.cloud.security_group_rule:
        cloud: "{{ cloud }}"
        security_group: "{{ prefix }}-access"
        protocol: tcp
        port_range_min: "{{ item }}"
        port_range_max: "{{ item }}"
        remote_ip_prefix: "{{ my_ip }}"
      loop: [22, 5986, 80]

    - name: Launch the Linux instance
      openstack.cloud.server:
        cloud: "{{ cloud }}"
        name: "{{ prefix }}-web-01"
        image: "{{ linux_image }}"
        flavor: v1.c1r2
        boot_from_volume: true
        volume_size: 20
        terminate_volume: true
        key_name: "{{ prefix }}-key"
        network: "{{ network }}"
        security_groups: [default, "{{ prefix }}-access"]
        floating_ip_pools: ["{{ external_network }}"]
        metadata:
          os: linux
        wait: true
        timeout: 900

    - name: Launch the Windows instance
      openstack.cloud.server:
        cloud: "{{ cloud }}"
        name: "{{ prefix }}-win-01"
        image: "{{ windows_image }}"
        flavor: v1.c2r8
        boot_from_volume: true
        volume_size: 80
        terminate_volume: true
        network: "{{ network }}"
        security_groups: [default, "{{ prefix }}-access"]
        floating_ip_pools: ["{{ external_network }}"]
        userdata: "{{ lookup('file', 'winrm-https.ps1') }}"
        metadata:
          os: windows
        wait: true
        timeout: 900
