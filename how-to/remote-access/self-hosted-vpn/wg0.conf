# WireGuard on the VPN instance, saved as /etc/wireguard/wg0.conf

[Interface]
Address = 10.8.0.1/32
ListenPort = 51820
PrivateKey = <server-private-key>
# Sends traffic from the tunnel on to your network with the VPN instance's own address
PostUp = iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -j MASQUERADE
PostDown = iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -j MASQUERADE

# One [Peer] section for each device that connects, each with its own tunnel address
[Peer]
PublicKey = <client-public-key>
AllowedIPs = 10.8.0.2/32
