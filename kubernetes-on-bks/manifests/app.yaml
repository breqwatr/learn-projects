apiVersion: v1
kind: Service
metadata:
  name: shop-app
spec:
  selector:
    app: shop-app
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-app
  template:
    metadata:
      labels:
        app: shop-app
    spec:
      # Spread the replicas across the workers, so losing one node doesn't take them all
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shop-app
      initContainers:
        - name: deps
          image: python:3.14.0-slim
          command: ["pip", "install", "--no-cache-dir", "--target", "/deps", "psycopg2-binary==2.9.12"]
          volumeMounts:
            - name: deps
              mountPath: /deps
      containers:
        - name: app
          image: python:3.14.0-slim
          command: ["python", "/app/app.py"]
          env:
            - name: PYTHONPATH
              value: /deps
            - name: DB_HOST
              value: shop-db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
            - name: deps
              mountPath: /deps
      volumes:
        - name: app
          configMap:
            name: shop-app
        - name: deps
          emptyDir: {}
